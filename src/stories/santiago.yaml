# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/scrollytelling.schema.json
#
# The story on src/pages/scrollytelling.mdx. The map stays on screen while the
# chapters scroll over it; each chapter moves the camera and shows layers.
# Chapter text (`description`) is HTML, not Markdown.
#
# TEXT TO WRITE: every chapter's description has a [bracketed] note saying
# what to write there. Replace those notes with your own text.
type: scrollytelling
id: santiago-story
theme: dark            # chapter cards: light or dark
showMarkers: true      # a dot per chapter at the right edge; click one to jump
markerColor: "#c2d96b"     # chapter dots on the right, the site accent

# The map when the page opens: the 32 comunas of Santiago, tilted, with terrain
# (the terrain and hillshade come from the basemap file).
config:
  mapStyle: "/data/Basemap.GIS4DP.json"
  center: [-70.70, -33.47]
  zoom: 10.2
  pitch: 45
  bearing: -20
  interactive: false   # scrolling moves the story, not the map

# Patterns, the same as on the Santiago Map (src/maps/full-page.yaml):
# a very dense square grid in each period colour, almost solid (public/img/).
# Each period also has a glowing edge (-glow and -line).
images:
  grid-1: { url: "/img/grid-1.png", pixelRatio: 2 }
  grid-2: { url: "/img/grid-2.png", pixelRatio: 2 }
  grid-3: { url: "/img/grid-3.png", pixelRatio: 2 }
  grid-4: { url: "/img/grid-4.png", pixelRatio: 2 }
  grid-5: { url: "/img/grid-5.png", pixelRatio: 2 }

# The five periods, the same mesh colours, filters and sizes as the Growth
# Periods map, draped over the terrain.
# They all start hidden; each chapter reveals one more, so they build up.
# The hexagons shrunk by number of years, the same file as the Growth Periods
# map: 0 years = 20% of full width, 54+ years = 100% (see src/maps/full-page.yaml).
sources:
  hexa_sized:
    type: geojson
    url: "/data/Hexa_sized.geojson"

layers:
  - id: story-1680-1806
    type: fill
    source: hexa_sized
    filter: ["<", ["get", "Year_Mean"], 1840]
    layout:
      visibility: none
    paint:
      fill-pattern: grid-1   # #9b00e8 grid
      fill-opacity: 0.75

  - id: story-1840-1941
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5]]
    layout:
      visibility: none
    paint:
      fill-pattern: grid-2   # #ff00ff grid
      fill-opacity: 0.75

  - id: story-1943-1985
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667]]
    layout:
      visibility: none
    paint:
      fill-pattern: grid-3   # #ff4d94 grid
      fill-opacity: 0.75

  - id: story-1986-2013
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4]]
    layout:
      visibility: none
    paint:
      fill-pattern: grid-4   # #ffa31a grid
      fill-opacity: 0.75

  - id: story-2014-2024
    type: fill
    source: hexa_sized
    filter: [">=", ["get", "Year_Mean"], 2014.4]
    layout:
      visibility: none
    paint:
      fill-pattern: grid-5   # #ffff00 grid
      fill-opacity: 0.75

  # Comuna boundaries and names, on for the whole story.
  - id: story-1680-1806-glow
    type: line
    source: hexa_sized
    filter: ["<", ["get", "Year_Mean"], 1840]
    layout:
      visibility: none
    paint:
      line-color: "#9b00e8"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45

  - id: story-1680-1806-line
    type: line
    source: hexa_sized
    filter: ["<", ["get", "Year_Mean"], 1840]
    layout:
      visibility: none
    paint:
      line-color: "#9b00e8"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95

  - id: story-1840-1941-glow
    type: line
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5]]
    layout:
      visibility: none
    paint:
      line-color: "#ff00ff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45

  - id: story-1840-1941-line
    type: line
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5]]
    layout:
      visibility: none
    paint:
      line-color: "#ff00ff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95

  - id: story-1943-1985-glow
    type: line
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667]]
    layout:
      visibility: none
    paint:
      line-color: "#ff4d94"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45

  - id: story-1943-1985-line
    type: line
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667]]
    layout:
      visibility: none
    paint:
      line-color: "#ff4d94"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95

  - id: story-1986-2013-glow
    type: line
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4]]
    layout:
      visibility: none
    paint:
      line-color: "#ffa31a"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45

  - id: story-1986-2013-line
    type: line
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4]]
    layout:
      visibility: none
    paint:
      line-color: "#ffa31a"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95

  - id: story-2014-2024-glow
    type: line
    source: hexa_sized
    filter: [">=", ["get", "Year_Mean"], 2014.4]
    layout:
      visibility: none
    paint:
      line-color: "#ffff00"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45

  - id: story-2014-2024-line
    type: line
    source: hexa_sized
    filter: [">=", ["get", "Year_Mean"], 2014.4]
    layout:
      visibility: none
    paint:
      line-color: "#ffff00"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95

  - id: story-comunas
    type: line
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      line-color: "#9aa4ac"
      line-width: 1.2
      line-opacity: 0.85

  - id: story-comuna-names
    type: symbol
    source:
      type: geojson
      url: "/data/comunas_labels.geojson"
    layout:
      text-field: ["get", "COMUNA"]
      # JetBrains Mono (the body font): declared under "font-faces" in public/data/Basemap.GIS4DP.json
      # (files in public/fonts/), so it matches the site's body text.
      text-font: ["JetBrains Mono", "Noto Sans Regular"]
      text-size: ["interpolate", ["linear"], ["zoom"], 10, 10, 13, 14]
      text-max-width: 7
    paint:
      text-color: "#c2d96b"       # same as the side panel text
      text-halo-color: "#161718"  # very dark gray outline
      text-halo-width: 1.5

  # Santiago and Providencia, where the oldest hexagons are: a thick white
  # outline shown only in the 1680–1806 chapter.
  - id: story-highlight
    type: line
    source:
      type: geojson
      url: "/data/comunas.geojson"
    filter: ["in", ["get", "COMUNA"], ["literal", ["Santiago", "Providencia"]]]
    layout:
      visibility: none
    paint:
      line-color: "#ffffff"
      line-width: 3.5

chapters:
  - id: intro
    title: Santiago, 1680–2024
    description: >-
      <p>[Introduce your project: what the hexagons measure, where the data
      comes from, and the question you are asking about Santiago.]</p>
      <p>Each hexagon is coloured by its mean year and sized by its number of
      years. Scroll to watch the city build up, period by period.</p>
    center: [-70.70, -33.47]
    zoom: 10.2
    pitch: 45
    bearing: -20
    alignment: center

  - id: valley
    title: A city between mountains
    description: >-
      <p>[Describe the setting: the Santiago basin, the Andes to the east and
      the coastal range to the west, and how the terrain shapes where the city
      can grow.]</p>
    center: [-70.55, -33.45]
    zoom: 9.6
    pitch: 70
    bearing: 80
    alignment: left

  - id: period-1
    title: 1680–1806
    description: >-
      <p>[Write about the oldest period: 6 hexagons in the historic centre,
      in the comunas of Santiago and Providencia (outlined in white).]</p>
    center: [-70.640, -33.440]
    zoom: 12.8
    pitch: 60
    bearing: -20
    alignment: left
    layers:
      show: [story-1680-1806, story-1680-1806-glow, story-1680-1806-line, story-highlight]

  - id: period-2
    title: 1840–1941
    description: >-
      <p>[Write about this period: 69 hexagons spreading around the
      centre.]</p>
    center: [-70.653, -33.460]
    zoom: 12
    pitch: 60
    bearing: -10
    alignment: right
    layers:
      show: [story-1840-1941, story-1840-1941-glow, story-1840-1941-line]
      hide: [story-highlight]

  - id: period-3
    title: 1943–1985
    description: >-
      <p>[Write about this period: 347 hexagons, the city growing outward in
      every direction.]</p>
    center: [-70.643, -33.481]
    zoom: 11
    pitch: 55
    bearing: 0
    alignment: left
    layers:
      show: [story-1943-1985, story-1943-1985-glow, story-1943-1985-line]

  - id: period-4
    title: 1986–2013
    description: >-
      <p>[Write about this period: 377 hexagons filling in the outer
      comunas.]</p>
    center: [-70.70, -33.47]
    zoom: 10.6
    pitch: 50
    bearing: 15
    alignment: right
    layers:
      show: [story-1986-2013, story-1986-2013-glow, story-1986-2013-line]

  - id: period-5
    title: 2014–2024
    description: >-
      <p>[Write about the newest period: 250 hexagons, the most recent
      additions.]</p>
    center: [-70.70, -33.47]
    zoom: 10.4
    pitch: 50
    bearing: -15
    alignment: left
    layers:
      show: [story-2014-2024, story-2014-2024-glow, story-2014-2024-line]

  - id: outro
    title: Santiago today
    description: >-
      <p>[Sum up what the map shows and what you learned.] Open the full page
      map to explore each hexagon and switch periods on and off.</p>
    center: [-70.70, -33.47]
    zoom: 10.3
    pitch: 55
    rotateAnimation: true
    alignment: full

footer: >-
  <p>Data: [your data source]. Comuna boundaries: caracena/chile-geojson.
  Basemap and terrain: © MapTiler,
  © OpenStreetMap contributors.</p>
