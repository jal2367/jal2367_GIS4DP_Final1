# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on src/pages/full_page_map.mdx ("Santiago Map"): urban growth
# (hexagons by period) and hydrography (natural and engineered water) on one
# map, with zoom and reset buttons and the layer rail and side panel
# (src/scripts/map-panels.js, src/scripts/layer-rail.js).
type: map
id: full-page
config:
  mapStyle: "/data/Basemap.GIS4DP.json"
  center: [-70.70, -33.47]   # middle of the hexagons in the 32 comunas
  zoom: 10.5
  minZoom: 9.7    # farthest zoom-out: fits the Province of Santiago (32 comunas)
  maxBounds: [[-71.25, -33.85], [-69.9, -32.9]]   # panning stays around the province
  pitch: 55      # camera tilt in degrees (0 = flat, max 85)
  bearing: -20   # rotation in degrees (0 = north up)

# No colour legend: the period pill buttons in the layer panel show the colours
# (src/scripts/map-panels.js). The size legend is drawn on the page.
legend: false

# Inside of the hexagons, one pattern per period: a very dense square grid in
# the period colour, so it reads almost as a solid colour with a fine screen
# texture up close (3 px PNG tiles in public/img/, drawn at pixelRatio 2:
# lines 1.5 px apart on screen).
# A pattern replaces the fill colour, so the colour is baked into each image.
# The bright glowing edges are the hexa-line-* and hexa-glow-* layers below.
images:
  grid-1: { url: "/img/grid-1.png", pixelRatio: 2 }
  grid-2: { url: "/img/grid-2.png", pixelRatio: 2 }
  grid-3: { url: "/img/grid-3.png", pixelRatio: 2 }
  grid-4: { url: "/img/grid-4.png", pixelRatio: 2 }
  grid-5: { url: "/img/grid-5.png", pixelRatio: 2 }

# Comuna filter: a dropdown in the layer panel. Every hexagon layer's `filter`
# reads the choice with ["global-state", "comuna"] and shows either all
# hexagons or only that comuna's. The comuna outlines highlight the choice.
state:
  comuna:
    default: "All comunas"
  # The comuna last clicked on the map (set by src/scripts/comuna-zoom.js);
  # its boundary is highlighted like the dropdown choice. No control.
  highlight:
    default: ""
  # "Urbanization rate" on/off: a checkbox in the layer panel. On = each hexagon
  # scaled by its urbanization rate (built ha per year); off = all full size.
  sizes:
    default: true
  # Period switches (checkboxes in the layer panel); each one controls both
  # the 3D and the draped layer of its period.
  p1:
    default: true
  p2:
    default: true
  p3:
    default: true
  p4:
    default: true
  p5:
    default: true
parameters:
  comuna:
    label: Comuna
    type: enum
    values:
      - All comunas
      - Cerrillos
      - Cerro Navia
      - Conchalí
      - El Bosque
      - Estación Central
      - Huechuraba
      - Independencia
      - La Cisterna
      - La Florida
      - La Granja
      - La Pintana
      - La Reina
      - Las Condes
      - Lo Barnechea
      - Lo Espejo
      - Lo Prado
      - Macul
      - Maipú
      - Ñuñoa
      - Pedro Aguirre Cerda
      - Peñalolén
      - Providencia
      - Pudahuel
      - Quilicura
      - Quinta Normal
      - Recoleta
      - Renca
      - San Joaquín
      - San Miguel
      - San Ramón
      - Santiago
      - Vitacura
  p1:
    label: 1576–1751
    type: toggle
  p2:
    label: 1752–1934
    type: toggle
  p3:
    label: 1935–1977
    type: toggle
  p4:
    label: 1978–2004
    type: toggle
  p5:
    label: 2005–2024
    type: toggle
  sizes:
    label: Urbanization rate
    type: toggle

# Urbanization hexagons: a 500 m hexagon grid (flat-top, 500 m flat to flat,
# like the QGIS grid in Hexagons.geojson but half the size; generated in
# EPSG:8951, UTM zone 19S) intersected with Built_Hist_2024.geojson (historic
# growth 1541-2000, built area 2010 and 2024; field crecimiento = year
# built). A hexagon is kept only if at least 10% of it is built (11,307 of
# 94,164; 15,349 touch built area at all):
#   Year_Min / Year_Max  earliest / latest crecimiento year inside it
#   Year_Mean            crecimiento averaged by built area (area-weighted)
#   #Years               Year_Max - Year_Min
#   Built_ha / Built_pct built area inside the hexagon (hectares / % of it)
#   Build_years          years it took to build: from the map date before
#                        Year_Min (1541, 1600, 1900 ... 2000, 2010) to Year_Max
#   Urb_rate             urbanization rate = Built_ha / Build_years (ha/yr)
#   COMUNA               comuna containing the hexagon's centre (32 comunas)
# converted to longitude/latitude for the web (a script; see git history).
#
# Coloured by Year_Mean in 5 natural-breaks (Jenks) classes of the new data:
# 1576-1751, 1752-1934, 1935-1977, 1978-2004, 2005-2024, in the
# onyx-magenta-yellow gradient: purple #9b00e8, magenta #ff00ff, pink
# #ff4d94, orange #ffa31a, yellow #ffff00. Each period has two draped
# layers, sized and full-size; the period buttons are state switches
# (p1-p5) read by both layers' `filter`. Hexagons have no popup; click a
# comuna for its summary.
#
# hexa = full-size hexagons; hexa_sized = the same hexagons shrunk around
# their centre by Urb_rate: 0 ha/yr = 20% of full width, 1.15 ha/yr or more
# (the fastest 10%) = 100%, linear in between (Size_pct holds the percentage).
#
# Area note: the shape_area / Shape__Are fields in Built_Hist_2024 are about
# 44% too large (measured in Web Mercator, which inflates areas by 1/cos^2 of
# the latitude); all areas here are measured from the geometry in UTM 19S.
sources:
  hexa:
    type: geojson
    url: "/data/Hexa_wgs84.geojson"
  hexa_sized:
    type: geojson
    url: "/data/Hexa_sized.geojson"
  # hidrografia.geojson is Hydrografia2.geojson made lighter for the web: the
  # whole region (not clipped), the CAD layer names grouped into TIPO, lines
  # simplified to 8 m, coordinates rounded to ~1 m, and all lines of one TIPO
  # merged into one feature (5 in all). Dropped as not water: CAD audit
  # leftovers, "ca" and mining tailings dams (TRANQUE DE RELAVE). Declared once
  # here so the hydrography layers share one copy (4.3 MB, about 1.1 MB to
  # download).
  hidrografia:
    type: geojson
    url: "/data/hidrografia.geojson"
  # Puntos críticos de invierno 2026 (SENAPRED, Programa Invierno): the
  # 2,320 points in the Región Metropolitana, downloaded from
  # visor-grd.senapred.gob.cl (ArcGIS MapServer PROG_INVIERNO_2/
  # Puntos_Criticos_INV_2026, layer 0) with the fields used here.
  puntos_criticos:
    type: geojson
    url: "/data/puntos_criticos_invierno.geojson"
  # Comuna boundaries, shared by the outline and its shadow.
  comunas_lines:
    type: geojson
    url: "/data/comunas.geojson"
  # Collector network, shared by its line and its glow.
  colector:
    type: geojson
    url: "/data/sistema_colector.geojson"


layers:
  # Hexagons, all draped over the terrain and basemap (flat fills follow the
  # ground). Fading from 70% to 30% as you zoom in to street level.
  # Sized hexagons, shown when "Urbanization rate" is on:
  - id: hexa-sized-1576-1751
    type: fill
    source: hexa_sized
    filter: ["all", ["<", ["get", "Year_Mean"], 1751.45], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-1
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1576–1751, color: "#9b00e8", shape: square }

  - id: hexa-sized-1752-1934
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1751.45], ["<", ["get", "Year_Mean"], 1934.25], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-2
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1752–1934, color: "#ff00ff", shape: square }

  - id: hexa-sized-1935-1977
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1934.25], ["<", ["get", "Year_Mean"], 1977.95], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-3
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1935–1977, color: "#ff4d94", shape: square }

  - id: hexa-sized-1978-2004
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1977.95], ["<", ["get", "Year_Mean"], 2004.45], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-4
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1978–2004, color: "#ffa31a", shape: square }

  - id: hexa-sized-2005-2024
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 2004.45], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-5
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 2005–2024, color: "#ffff00", shape: square }

  # Full-size hexagons, shown when "Urbanization rate" is off:
  - id: hexa-full-1576-1751
    type: fill
    source: hexa
    filter: ["all", ["<", ["get", "Year_Mean"], 1751.45], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-1
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-1752-1934
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1751.45], ["<", ["get", "Year_Mean"], 1934.25], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-2
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-1935-1977
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1934.25], ["<", ["get", "Year_Mean"], 1977.95], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-3
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-1978-2004
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1977.95], ["<", ["get", "Year_Mean"], 2004.45], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-4
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-2005-2024
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 2004.45], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-5
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  # Glowing hexagon edges, like a radar screen: a blurred wide line (glow)
  # under a thin bright one, coloured by period with the same breaks, comuna
  # filter, period buttons and size switch as the fills above.
  - id: hexa-glow-sized
    type: line
    source: hexa_sized
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], true], ["any", ["all", ["<", ["get", "Year_Mean"], 1751.45], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1751.45], ["<", ["get", "Year_Mean"], 1934.25], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1934.25], ["<", ["get", "Year_Mean"], 1977.95], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1977.95], ["<", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1751.45, "#ff00ff", 1934.25, "#ff4d94", 1977.95, "#ffa31a", 2004.45, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45
    legend: false

  - id: hexa-line-sized
    type: line
    source: hexa_sized
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], true], ["any", ["all", ["<", ["get", "Year_Mean"], 1751.45], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1751.45], ["<", ["get", "Year_Mean"], 1934.25], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1934.25], ["<", ["get", "Year_Mean"], 1977.95], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1977.95], ["<", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1751.45, "#ff00ff", 1934.25, "#ff4d94", 1977.95, "#ffa31a", 2004.45, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95
    legend: false

  - id: hexa-glow-full
    type: line
    source: hexa
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], false], ["any", ["all", ["<", ["get", "Year_Mean"], 1751.45], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1751.45], ["<", ["get", "Year_Mean"], 1934.25], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1934.25], ["<", ["get", "Year_Mean"], 1977.95], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1977.95], ["<", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1751.45, "#ff00ff", 1934.25, "#ff4d94", 1977.95, "#ffa31a", 2004.45, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45
    legend: false

  - id: hexa-line-full
    type: line
    source: hexa
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], false], ["any", ["all", ["<", ["get", "Year_Mean"], 1751.45], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1751.45], ["<", ["get", "Year_Mean"], 1934.25], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1934.25], ["<", ["get", "Year_Mean"], 1977.95], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1977.95], ["<", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2004.45], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1751.45, "#ff00ff", 1934.25, "#ff4d94", 1977.95, "#ffa31a", 2004.45, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95
    legend: false

  # Invisible comuna areas that make each comuna clickable: a click opens the
  # comuna's info panel and flies the map to it.
  # Mean_year, Period, Hexagons, First_year and Last_year were calculated from
  # the hexagons and saved in comunas.geojson.
  - id: comunas-fill
    type: fill
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      fill-color: "#ffffff"
      fill-opacity: 0
    legend: false
    # No popup: a click opens the comuna's info panel in place of the side
    # panel (src/scripts/map-panels.js) and flies there (comuna-zoom.js).
    interactive:
      hover:
        cursor: pointer

  # ---- Hydrography (merged from the former Hydrography page) ----
  # Colours (aquamarine / midnight blue / dark violet palette): natural water
  # in aquamarines, deepest for the biggest (rivers #00d6a8) to palest for
  # the smallest (ravines #c9fff0); engineered water in dark violets, deepest
  # for the biggest system (collector network #9400d3) to palest (reservoirs
  # and ponds #dba8ff, mostly man-made). Each line has a soft "-glow" copy
  # underneath (wider, blurred) for the neon look. Width, opacity and glow
  # step down with size so the hierarchy reads at a glance: rivers and the
  # collector network boldest, ravines and reservoirs faintest. The layer rail
  # (src/scripts/layer-rail.js) uses the same colours; keep them in step.
  #
  # Hydrography (rivers, streams, ravines, canals, reservoirs) all come from
  # the shared "hidrografia" source above; each TIPO is its own layer.
  - id: hydro-ravines-glow
    type: line
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Ravines"]
    paint:
      line-color: "#c9fff0"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 1.5, 14, 3]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 1.2, 14, 2.4]
      line-opacity: 0.08
    legend: false

  - id: hydro-ravines
    type: line
    label: Ravines (quebradas)
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Ravines"]
    paint:
      line-color: "#c9fff0"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.4, 14, 1]
      line-opacity: 0.45
      line-dasharray: [3, 2]
    legend: false
    interactive: &hydro-popup
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: TIPO

  - id: hydro-reservoirs-glow
    type: line
    layout: { visibility: none }   # engineered features start off
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Reservoirs and ponds"]
    paint:
      line-color: "#dba8ff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 2, 14, 4]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 1.6, 14, 3.2]
      line-opacity: 0.15
    legend: false

  - id: hydro-reservoirs
    type: line
    layout: { visibility: none }   # engineered features start off
    label: Reservoirs and ponds
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Reservoirs and ponds"]
    paint:
      line-color: "#dba8ff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.5]
      line-opacity: 0.6
    legend: false
    interactive: *hydro-popup

  - id: hydro-canals-glow
    type: line
    layout: { visibility: none }   # engineered features start off
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Canals"]
    paint:
      line-color: "#b44cff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 6]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.4, 14, 4.8]
      line-opacity: 0.2
    legend: false

  - id: hydro-canals
    type: line
    layout: { visibility: none }   # engineered features start off
    label: Canals
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Canals"]
    paint:
      line-color: "#b44cff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.8, 14, 2]
      line-opacity: 0.75
    legend: false
    interactive: *hydro-popup

  - id: hydro-streams-glow
    type: line
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Streams"]
    paint:
      line-color: "#7fffd4"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 4, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 3.2, 14, 7.2]
      line-opacity: 0.3
    legend: false

  - id: hydro-streams
    type: line
    label: Streams (esteros)
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Streams"]
    paint:
      line-color: "#7fffd4"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 1.1, 14, 2.8]
      line-opacity: 0.9
    legend: false
    interactive: *hydro-popup

  - id: hydro-rivers-glow
    type: line
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Rivers"]
    paint:
      line-color: "#00d6a8"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 10, 14, 24]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 8, 14, 19.2]
      line-opacity: 0.55
    legend: false

  - id: hydro-rivers
    type: line
    label: Rivers
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Rivers"]
    paint:
      line-color: "#00d6a8"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 8]
      line-opacity: 1
    legend: false
    interactive: *hydro-popup

  # Collector network (Sistema Colector) from the Dirección de Obras
  # Hidráulicas: the deepest dark violet. sistema_colector.geojson is
  # "Sistema Colector.geojson" cut down to the Región Metropolitana (1,265 of
  # 2,937 lines) with only the fields used here, simplified to 5 m (0.4 MB),
  # so the page loads faster.
  - id: sistema-colector-glow
    type: line
    layout: { visibility: none }   # engineered features start off
    source: colector
    paint:
      line-color: "#9400d3"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 6, 14, 12]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 4.8, 14, 9.6]
      line-opacity: 0.4
    legend: false

  - id: sistema-colector
    type: line
    layout: { visibility: none }   # engineered features start off
    label: Collector network
    source: colector
    paint:
      line-color: "#9400d3"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 1.6, 14, 4]
      line-opacity: 0.95
    legend: false
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: NOMBRE
                else: "Collector"
          - p:
              - str: "Length: "
              - property: LONG_M
              - str: " m"
          - p:
              - str: "Updated: "
              - property: ACTUALIZADO
          - p:
              - str: "Source: Dirección de Obras Hidráulicas"


  # Risk-weighted kernel density of the puntos críticos (a MapLibre
  # heatmap): each point weighted strongly by its risk level (Bajo 0.5,
  # Medio 1, Alto 3, Muy Alto 8: one Muy Alto outweighs 16 Bajo), so hot
  # spots follow serious risk rather than just many points. Same magenta
  # ramp as the points, under them.
  - id: pc-density
    type: heatmap
    layout: { visibility: none }   # off when the page opens
    source: puntos_criticos
    paint:
      heatmap-weight: ["match", ["get", "nivel"], "Muy Alto", 8, "Alto", 3, "Medio", 1, 0.5]
      heatmap-intensity: ["interpolate", ["linear"], ["zoom"], 9, 0.09, 13, 0.25, 15, 0.45]
      heatmap-radius: ["interpolate", ["linear"], ["zoom"], 9, 22, 12, 50, 15, 90]
      heatmap-color: ["interpolate", ["linear"], ["heatmap-density"], 0, "rgba(110, 0, 115, 0)", 0.15, "rgba(110, 0, 115, 0.45)", 0.4, "#b000b3", 0.7, "#ff00ff", 1, "#ff7aff"]
      heatmap-opacity: 0.7
    legend: false

  # Puntos críticos de invierno, graduated magenta (the hexagons' #ff00ff)
  # by nivel_de_riesgo: dim
  # and small for Bajo up to bright and large (with a glow) for Muy Alto.
  # One layer per level, so each gets its own pill in the side panel.

  - id: pc-bajo
    type: circle
    layout: { visibility: none }   # off when the page opens
    source: puntos_criticos
    filter: ["==", ["get", "nivel"], "Bajo"]
    paint:
      circle-color: "#6e0073"
      circle-radius: ["interpolate", ["linear"], ["zoom"], 10, 2, 15, 3.5]
      circle-opacity: 0.85
      circle-stroke-color: "#0a0a0a"
      circle-stroke-width: 0.6
    legend: false
    interactive: &pc-popup
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: sector
                else: "Punto crítico"
          - p:
              - str: "Comuna: "
              - property: comuna
          - p:
              - str: "Riesgo: "
              - property: nivel
          - p:
              - str: "Causa: "
              - property: causa
          - p:
              - str: "Acción: "
              - property: accion
          - p:
              - str: "Fuente: SENAPRED, Invierno 2026"

  - id: pc-medio
    type: circle
    layout: { visibility: none }   # off when the page opens
    source: puntos_criticos
    filter: ["==", ["get", "nivel"], "Medio"]
    paint:
      circle-color: "#b000b3"
      circle-radius: ["interpolate", ["linear"], ["zoom"], 10, 2.6, 15, 4.5]
      circle-opacity: 0.9
      circle-stroke-color: "#0a0a0a"
      circle-stroke-width: 0.6
    legend: false
    interactive: *pc-popup

  - id: pc-alto
    type: circle
    layout: { visibility: none }   # off when the page opens
    source: puntos_criticos
    filter: ["==", ["get", "nivel"], "Alto"]
    paint:
      circle-color: "#ff00ff"
      circle-radius: ["interpolate", ["linear"], ["zoom"], 10, 3.2, 15, 5.5]
      circle-opacity: 0.95
      circle-stroke-color: "#0a0a0a"
      circle-stroke-width: 0.6
    legend: false
    interactive: *pc-popup

  - id: pc-muy-alto-glow
    type: circle
    layout: { visibility: none }   # off when the page opens
    source: puntos_criticos
    filter: ["==", ["get", "nivel"], "Muy Alto"]
    paint:
      circle-color: "#ff7aff"
      circle-radius: ["interpolate", ["linear"], ["zoom"], 10, 9, 15, 16]
      circle-blur: 1
      circle-opacity: 0.45
    legend: false

  - id: pc-muy-alto
    type: circle
    layout: { visibility: none }   # off when the page opens
    source: puntos_criticos
    filter: ["==", ["get", "nivel"], "Muy Alto"]
    paint:
      circle-color: "#ff7aff"
      circle-radius: ["interpolate", ["linear"], ["zoom"], 10, 4, 15, 7]
      circle-opacity: 1
      circle-stroke-color: "#0a0a0a"
      circle-stroke-width: 0.6
    legend: false
    interactive: *pc-popup

  # Comuna boundaries for the 32 comunas, from caracena/chile-geojson on
  # GitHub (Región Metropolitana file). The comuna picked in the dropdown is
  # (or clicked on the map) is drawn thicker and in white; picking it also flies the map there (see
  # src/scripts/comuna-zoom.js).
  # Metro-area comunas outside the Province of Santiago (the commuter belt:
  # Puente Alto, San Bernardo, Padre Hurtado, Pirque, Colina, Lampa, Calera
  # de Tango, Buin, Paine, Talagante, Peñaflor), for context: dashed outlines
  # and names only (not clickable, not in the dropdown). Same source as
  # comunas.geojson (caracena/chile-geojson, Región Metropolitana).
  - id: comunas-metro-outline
    type: line
    source:
      type: geojson
      url: "/data/comunas_metro.geojson"
    paint:
      line-color: "#c8ced3"
      line-width: ["interpolate", ["linear"], ["zoom"], 9, 1.2, 13, 2]
      line-opacity: 0.95
      line-dasharray: [3, 2.5]
    legend: false

  - id: comunas-metro-labels
    type: symbol
    source:
      type: geojson
      url: "/data/comunas_metro_labels.geojson"
    layout:
      text-field: ["get", "COMUNA"]
      text-font: ["JetBrains Mono", "Noto Sans Regular"]
      text-size: ["interpolate", ["linear"], ["zoom"], 10, 9.5, 13, 13]
      text-max-width: 7
    paint:
      text-color: "#b8bdc2"     # a step dimmer than the 32 comunas' names
      text-halo-color: "#0a0a0a"
      text-halo-width: 1.5
    legend: false

  # A soft dark shadow under the boundaries, nudged down a few pixels, so
  # the lines look lifted slightly above the hexagons, water and points.
  - id: comunas-shadow
    type: line
    source: comunas_lines
    paint:
      line-color: "#000000"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 4, 14, 7]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 5]
      line-opacity: 0.75
      line-translate: [0, 4]
      line-translate-anchor: viewport
    legend: false

  - id: comunas-outline
    type: line
    label: Comuna boundaries
    source: comunas_lines
    paint:
      line-color: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], "#ffffff", "#9aa4ac"]
      line-width: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], 3, 1.3]
      line-opacity: 0.95
    legend: false

  # Comuna names, one point per comuna (comunas_labels.geojson, made from the
  # boundaries). Fonts come from the basemap's MapTiler font server.
  - id: comunas-labels
    type: symbol
    label: Comuna names
    source:
      type: geojson
      url: "/data/comunas_labels.geojson"
    layout:
      text-field: ["get", "COMUNA"]
      # JetBrains Mono (the body font): declared under "font-faces" in public/data/Basemap.GIS4DP.json
      # (files in public/fonts/), so it matches the site's body text.
      text-font: ["JetBrains Mono", "Noto Sans Regular"]
      text-size: ["interpolate", ["linear"], ["zoom"], 10, 10, 13, 14]
      text-max-width: 7
    paint:
      text-color: "#e8e8e8"       # very light gray
      text-halo-color: "#0a0a0a"  # very dark gray outline (onyx)
      text-halo-width: 1.5
    legend: false
