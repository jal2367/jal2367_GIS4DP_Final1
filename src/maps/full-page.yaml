# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on src/pages/full_page_map.mdx: it fills the window under the site
# header, with zoom and reset buttons, a legend and a layer panel.
type: map
id: full-page
config:
  mapStyle: "/data/Basemap.GIS4DP.json"
  center: [-70.70, -33.47]   # middle of the hexagons in the 32 comunas
  zoom: 10.5
  minZoom: 10     # farthest zoom-out: just fits the 32 comunas
  pitch: 55      # camera tilt in degrees (0 = flat, max 85)
  bearing: -20   # rotation in degrees (0 = north up)

# Where the legend sits: top-left (default), top-right, bottom-left, bottom-right.
legend:
  position: bottom-left
  title: "Colour: mean year · Height: number of years (varied within each period)"

# Mesh patterns for the hexagons, one per period: a fine staggered grid of
# slightly lighter dots on the period colour (8 px PNG tiles in public/img/,
# drawn at pixelRatio 2: dots 1 px wide and 2 px apart on screen, crisp on
# high-resolution screens), so it reads as a texture rather than single dots.
# (A pattern replaces fill-extrusion-color, so the colour is baked in.)
images:
  stipple-1: { url: "/img/stipple-1.png", pixelRatio: 2 }
  stipple-2: { url: "/img/stipple-2.png", pixelRatio: 2 }
  stipple-3: { url: "/img/stipple-3.png", pixelRatio: 2 }
  stipple-4: { url: "/img/stipple-4.png", pixelRatio: 2 }
  stipple-5: { url: "/img/stipple-5.png", pixelRatio: 2 }

# Comuna filter: a dropdown in the layer panel. Every hexagon layer's `filter`
# reads the choice with ["global-state", "comuna"] and shows either all
# hexagons or only that comuna's. The comuna outlines highlight the choice.
state:
  comuna:
    default: "All comunas"
  # The comuna last clicked on the map (set by src/scripts/comuna-zoom.js);
  # its boundary is highlighted like the dropdown choice. No control.
  highlight:
    default: ""
  # Hexagon heights on/off: a checkbox in the layer panel. Off = flat hexagons.
  heights:
    default: true
  # Period switches (checkboxes in the layer panel); each one controls both
  # the 3D and the draped layer of its period.
  p1:
    default: true
  p2:
    default: true
  p3:
    default: true
  p4:
    default: true
  p5:
    default: true
parameters:
  comuna:
    label: Comuna
    type: enum
    values:
      - All comunas
      - Cerrillos
      - Cerro Navia
      - Conchalí
      - El Bosque
      - Estación Central
      - Huechuraba
      - Independencia
      - La Cisterna
      - La Florida
      - La Granja
      - La Pintana
      - La Reina
      - Las Condes
      - Lo Barnechea
      - Lo Espejo
      - Lo Prado
      - Macul
      - Maipú
      - Ñuñoa
      - Pedro Aguirre Cerda
      - Peñalolén
      - Providencia
      - Pudahuel
      - Quilicura
      - Quinta Normal
      - Recoleta
      - Renca
      - San Joaquín
      - San Miguel
      - San Ramón
      - Santiago
      - Vitacura
  p1:
    label: 1680–1806
    type: toggle
  p2:
    label: 1840–1941
    type: toggle
  p3:
    label: 1943–1985
    type: toggle
  p4:
    label: 1986–2013
    type: toggle
  p5:
    label: 2014–2024
    type: toggle
  heights:
    label: Hexagon heights
    type: toggle

# Hexagons coloured by Year_Mean: 5 classes, natural breaks (Jenks), from
# #00204d (oldest) to #c2d96b (newest). Each period has two layers: a draped
# flat one that follows the terrain and a 3D one. The period checkboxes are
# state switches (p1-p5) read by both layers' `filter`.
#
# Hexa_wgs84.geojson is Hexa.geojson converted from UTM zone 19S to
# longitude/latitude, which web maps need.
#
# Hexagons have no popup; click a comuna instead for its summary.
#
# Hexagons are extruded (raised in 3D) by Height_m, a property in the GeoJSON:
# 10 metres per year, where the years are a random whole number within the
# period's range of #Years (1-10 for hexagons with #Years = 0). The real #Years
# is unchanged and shows in the popup. Heights were made by a script with a
# fixed seed, so they are the same every time.
#
# To change the look of every period at once, edit fill-extrusion-opacity in
# each layer's paint. To change a period's colour,
# change both its fill-extrusion-color and its legend color.
# The hexagons, loaded once and shared by the ten hexagon layers.
sources:
  hexa:
    type: geojson
    url: "/data/Hexa_wgs84.geojson"

layers:
  # Draped hexagons: flat fills that follow the terrain and basemap.
  # Shown when "Hexagon heights" is off, and at street level.
  - id: hexa-flat-1680-1806
    type: fill
    source: hexa
    filter: ["all", ["<", ["get", "Year_Mean"], 1840], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true]]
    paint:
      fill-pattern: stipple-1
      # Heights off: 70% fading to 30% at street level. Heights on: hidden
      # until zoom 12.5, then fading in as the 3D hexagons fade out.
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12.5, ["case", ["==", ["global-state", "heights"], true], 0, 0.7], 14.5, 0.3]
    legend: false

  - id: hexa-flat-1840-1941
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true]]
    paint:
      fill-pattern: stipple-2
      # Heights off: 70% fading to 30% at street level. Heights on: hidden
      # until zoom 12.5, then fading in as the 3D hexagons fade out.
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12.5, ["case", ["==", ["global-state", "heights"], true], 0, 0.7], 14.5, 0.3]
    legend: false

  - id: hexa-flat-1943-1985
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true]]
    paint:
      fill-pattern: stipple-3
      # Heights off: 70% fading to 30% at street level. Heights on: hidden
      # until zoom 12.5, then fading in as the 3D hexagons fade out.
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12.5, ["case", ["==", ["global-state", "heights"], true], 0, 0.7], 14.5, 0.3]
    legend: false

  - id: hexa-flat-1986-2013
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true]]
    paint:
      fill-pattern: stipple-4
      # Heights off: 70% fading to 30% at street level. Heights on: hidden
      # until zoom 12.5, then fading in as the 3D hexagons fade out.
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12.5, ["case", ["==", ["global-state", "heights"], true], 0, 0.7], 14.5, 0.3]
    legend: false

  - id: hexa-flat-2014-2024
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true]]
    paint:
      fill-pattern: stipple-5
      # Heights off: 70% fading to 30% at street level. Heights on: hidden
      # until zoom 12.5, then fading in as the 3D hexagons fade out.
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12.5, ["case", ["==", ["global-state", "heights"], true], 0, 0.7], 14.5, 0.3]
    legend: false

  # 3D hexagons, shown when "Hexagon heights" is on.
  - id: hexa-1680-1806
    type: fill-extrusion
    source: hexa
    filter: ["all", ["<", ["get", "Year_Mean"], 1840], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true], ["==", ["global-state", "heights"], true]]
    paint:
      fill-extrusion-pattern: stipple-1
      # Fade out as you zoom in to street level, where the draped layer takes
      # over and the 3D buildings show.
      fill-extrusion-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0]
      # At least 80 m so the 3D terrain does not cut through low hexagons
      fill-extrusion-height: ["max", ["get", "Height_m"], 80]
    legend: { label: 1680–1806, color: "#00204d", shape: square }

  - id: hexa-1840-1941
    type: fill-extrusion
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true], ["==", ["global-state", "heights"], true]]
    paint:
      fill-extrusion-pattern: stipple-2
      # Fade out as you zoom in to street level, where the draped layer takes
      # over and the 3D buildings show.
      fill-extrusion-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0]
      # At least 80 m so the 3D terrain does not cut through low hexagons
      fill-extrusion-height: ["max", ["get", "Height_m"], 80]
    legend: { label: 1840–1941, color: "#314e55", shape: square }

  - id: hexa-1943-1985
    type: fill-extrusion
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true], ["==", ["global-state", "heights"], true]]
    paint:
      fill-extrusion-pattern: stipple-3
      # Fade out as you zoom in to street level, where the draped layer takes
      # over and the 3D buildings show.
      fill-extrusion-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0]
      # At least 80 m so the 3D terrain does not cut through low hexagons
      fill-extrusion-height: ["max", ["get", "Height_m"], 80]
    legend: { label: 1943–1985, color: "#617d5c", shape: square }

  - id: hexa-1986-2013
    type: fill-extrusion
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true], ["==", ["global-state", "heights"], true]]
    paint:
      fill-extrusion-pattern: stipple-4
      # Fade out as you zoom in to street level, where the draped layer takes
      # over and the 3D buildings show.
      fill-extrusion-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0]
      # At least 80 m so the 3D terrain does not cut through low hexagons
      fill-extrusion-height: ["max", ["get", "Height_m"], 80]
    legend: { label: 1986–2013, color: "#92ab64", shape: square }

  - id: hexa-2014-2024
    type: fill-extrusion
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true], ["==", ["global-state", "heights"], true]]
    paint:
      fill-extrusion-pattern: stipple-5
      # Fade out as you zoom in to street level, where the draped layer takes
      # over and the 3D buildings show.
      fill-extrusion-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0]
      # At least 80 m so the 3D terrain does not cut through low hexagons
      fill-extrusion-height: ["max", ["get", "Height_m"], 80]
    legend: { label: 2014–2024, color: "#c2d96b", shape: square }

  # Invisible comuna areas that make each comuna clickable: a click opens a
  # summary popup and flies the map to the comuna (src/scripts/comuna-zoom.js).
  # Mean_year, Period, Hexagons, First_year and Last_year were calculated from
  # the hexagons and saved in comunas.geojson.
  - id: comunas-fill
    type: fill
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      fill-color: "#ffffff"
      fill-opacity: 0
    legend: false
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: COMUNA
          - p:
              - str: "Mean year: "
              - property: Mean_year
          - p:
              - str: "Period: "
              - property: Period
          - p:
              - str: "Years covered: "
              - property: First_year
              - str: "–"
              - property: Last_year
              - str: " ("
              - property: Hexagons
              - str: " hexagons)"

  # Comuna boundaries for the 32 comunas, from caracena/chile-geojson on
  # GitHub (Región Metropolitana file). The comuna picked in the dropdown is
  # (or clicked on the map) is drawn thicker and in white; picking it also flies the map there (see
  # src/scripts/comuna-zoom.js).
  - id: comunas-outline
    type: line
    label: Comuna boundaries
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      line-color: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], "#ffffff", "#9aa4ac"]
      line-width: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], 3, 1.2]
      line-opacity: 0.85
    legend: false

  # Comuna names, one point per comuna (comunas_labels.geojson, made from the
  # boundaries). Fonts come from the basemap's MapTiler font server.
  - id: comunas-labels
    type: symbol
    label: Comuna names
    source:
      type: geojson
      url: "/data/comunas_labels.geojson"
    layout:
      text-field: ["get", "COMUNA"]
      text-font: ["Metropolis Medium", "Noto Sans Regular"]
      text-size: ["interpolate", ["linear"], ["zoom"], 10, 10, 13, 14]
      text-max-width: 7
    paint:
      text-color: "#e6e9ec"
      text-halo-color: "#2b2d30"
      text-halo-width: 1.5
    legend: false
