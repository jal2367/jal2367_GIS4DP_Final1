# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on src/pages/full_page_map.mdx ("Santiago Map"): urban growth
# (hexagons by period) and hydrography (natural and engineered water) on one
# map, with zoom and reset buttons and the layer rail and side panel
# (src/scripts/map-panels.js, src/scripts/layer-rail.js).
type: map
id: full-page
config:
  mapStyle: "/data/Basemap.GIS4DP.json"
  center: [-70.70, -33.47]   # middle of the hexagons in the 32 comunas
  zoom: 10.5
  minZoom: 10     # farthest zoom-out: just fits the 32 comunas
  pitch: 55      # camera tilt in degrees (0 = flat, max 85)
  bearing: -20   # rotation in degrees (0 = north up)

# No colour legend: the period pill buttons in the layer panel show the colours
# (src/scripts/map-panels.js). The size legend is drawn on the page.
legend: false

# Inside of the hexagons, one pattern per period: a very dense square grid in
# the period colour, so it reads almost as a solid colour with a fine screen
# texture up close (3 px PNG tiles in public/img/, drawn at pixelRatio 2:
# lines 1.5 px apart on screen).
# A pattern replaces the fill colour, so the colour is baked into each image.
# The bright glowing edges are the hexa-line-* and hexa-glow-* layers below.
images:
  grid-1: { url: "/img/grid-1.png", pixelRatio: 2 }
  grid-2: { url: "/img/grid-2.png", pixelRatio: 2 }
  grid-3: { url: "/img/grid-3.png", pixelRatio: 2 }
  grid-4: { url: "/img/grid-4.png", pixelRatio: 2 }
  grid-5: { url: "/img/grid-5.png", pixelRatio: 2 }

# Comuna filter: a dropdown in the layer panel. Every hexagon layer's `filter`
# reads the choice with ["global-state", "comuna"] and shows either all
# hexagons or only that comuna's. The comuna outlines highlight the choice.
state:
  comuna:
    default: "All comunas"
  # The comuna last clicked on the map (set by src/scripts/comuna-zoom.js);
  # its boundary is highlighted like the dropdown choice. No control.
  highlight:
    default: ""
  # "Average years of development" on/off: a checkbox in the layer panel. On = each hexagon
  # scaled by its number of years; off = all hexagons full size.
  sizes:
    default: true
  # Period switches (checkboxes in the layer panel); each one controls both
  # the 3D and the draped layer of its period.
  p1:
    default: true
  p2:
    default: true
  p3:
    default: true
  p4:
    default: true
  p5:
    default: true
parameters:
  comuna:
    label: Comuna
    type: enum
    values:
      - All comunas
      - Cerrillos
      - Cerro Navia
      - Conchalí
      - El Bosque
      - Estación Central
      - Huechuraba
      - Independencia
      - La Cisterna
      - La Florida
      - La Granja
      - La Pintana
      - La Reina
      - Las Condes
      - Lo Barnechea
      - Lo Espejo
      - Lo Prado
      - Macul
      - Maipú
      - Ñuñoa
      - Pedro Aguirre Cerda
      - Peñalolén
      - Providencia
      - Pudahuel
      - Quilicura
      - Quinta Normal
      - Recoleta
      - Renca
      - San Joaquín
      - San Miguel
      - San Ramón
      - Santiago
      - Vitacura
  p1:
    label: 1680–1806
    type: toggle
  p2:
    label: 1840–1941
    type: toggle
  p3:
    label: 1943–1985
    type: toggle
  p4:
    label: 1986–2013
    type: toggle
  p5:
    label: 2014–2024
    type: toggle
  sizes:
    label: Average years of development
    type: toggle

# Hexagons coloured by Year_Mean: 5 classes, natural breaks (Jenks), from
# the onyx-magenta-yellow gradient, dark past to bright present: purple
# #9b00e8, magenta #ff00ff, pink #ff4d94, orange #ffa31a, yellow #ffff00.
# Each period has two draped layers,
# sized and full-size. The period checkboxes are state switches (p1-p5) read
# by both layers' `filter`.
#
# Hexa_wgs84.geojson is Hexa.geojson converted from UTM zone 19S to
# longitude/latitude, which web maps need.
#
# Hexagons have no popup; click a comuna instead for its summary.
#
# Hexagon size shows the number of years (#Years); see hexa_sized under
# sources: above. Click a comuna for its summary.
#
# To change a period's colour, make a new mesh image (public/img/) and change
# its legend color.
# The hexagons, each loaded once and shared by the hexagon layers:
# hexa = full-size hexagons; hexa_sized = the same hexagons shrunk around
# their centre by number of years (#Years): 0 years = 20% of full width,
# 54 years or more (the top 10%) = 100%, linear in between. Size_pct holds
# the percentage. Made from Hexa_wgs84.geojson by a script.
sources:
  hexa:
    type: geojson
    url: "/data/Hexa_wgs84.geojson"
  hexa_sized:
    type: geojson
    url: "/data/Hexa_sized.geojson"
  # hidrografia.geojson is Hydrografia2.geojson made lighter for the web: the
  # whole region (not clipped), lines simplified to about 3 m, the CAD layer
  # names grouped into TIPO (the original name is kept in CAPA). Dropped as not
  # water: CAD audit leftovers, "ca" and mining tailings dams (TRANQUE DE
  # RELAVE). Declared once here so the five layers share one copy (9 MB, about
  # 1.5 MB to download).
  hidrografia:
    type: geojson
    url: "/data/hidrografia.geojson"
  # Collector network, shared by its line and its glow.
  colector:
    type: geojson
    url: "/data/sistema_colector.geojson"


layers:
  # Hexagons, all draped over the terrain and basemap (flat fills follow the
  # ground). Fading from 70% to 30% as you zoom in to street level.
  # Sized hexagons, shown when "Average years of development" is on:
  - id: hexa-sized-1680-1806
    type: fill
    source: hexa_sized
    filter: ["all", ["<", ["get", "Year_Mean"], 1840], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-1
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1680–1806, color: "#9b00e8", shape: square }

  - id: hexa-sized-1840-1941
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-2
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1840–1941, color: "#ff00ff", shape: square }

  - id: hexa-sized-1943-1985
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-3
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1943–1985, color: "#ff4d94", shape: square }

  - id: hexa-sized-1986-2013
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-4
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 1986–2013, color: "#ffa31a", shape: square }

  - id: hexa-sized-2014-2024
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: grid-5
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: { label: 2014–2024, color: "#ffff00", shape: square }

  # Full-size hexagons, shown when "Average years of development" is off:
  - id: hexa-full-1680-1806
    type: fill
    source: hexa
    filter: ["all", ["<", ["get", "Year_Mean"], 1840], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-1
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-1840-1941
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-2
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-1943-1985
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-3
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-1986-2013
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-4
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  - id: hexa-full-2014-2024
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: grid-5
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.8, 14.5, 0.55]
    legend: false

  # Glowing hexagon edges, like a radar screen: a blurred wide line (glow)
  # under a thin bright one, coloured by period with the same breaks, comuna
  # filter, period buttons and size switch as the fills above.
  - id: hexa-glow-sized
    type: line
    source: hexa_sized
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], true], ["any", ["all", ["<", ["get", "Year_Mean"], 1840], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1840, "#ff00ff", 1942.5, "#ff4d94", 1985.666667, "#ffa31a", 2014.4, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45
    legend: false

  - id: hexa-line-sized
    type: line
    source: hexa_sized
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], true], ["any", ["all", ["<", ["get", "Year_Mean"], 1840], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1840, "#ff00ff", 1942.5, "#ff4d94", 1985.666667, "#ffa31a", 2014.4, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95
    legend: false

  - id: hexa-glow-full
    type: line
    source: hexa
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], false], ["any", ["all", ["<", ["get", "Year_Mean"], 1840], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1840, "#ff00ff", 1942.5, "#ff4d94", 1985.666667, "#ffa31a", 2014.4, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 7]
      line-opacity: 0.45
    legend: false

  - id: hexa-line-full
    type: line
    source: hexa
    filter: ["all", ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "sizes"], false], ["any", ["all", ["<", ["get", "Year_Mean"], 1840], ["==", ["global-state", "p1"], true]], ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["==", ["global-state", "p2"], true]], ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["==", ["global-state", "p3"], true]], ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p4"], true]], ["all", [">=", ["get", "Year_Mean"], 2014.4], ["==", ["global-state", "p5"], true]]]]
    paint:
      line-color: ["step", ["get", "Year_Mean"], "#9b00e8", 1840, "#ff00ff", 1942.5, "#ff4d94", 1985.666667, "#ffa31a", 2014.4, "#ffff00"]
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.6]
      line-opacity: 0.95
    legend: false

  # Invisible comuna areas that make each comuna clickable: a click opens a
  # summary popup and flies the map to the comuna (src/scripts/comuna-zoom.js).
  # Mean_year, Period, Hexagons, First_year and Last_year were calculated from
  # the hexagons and saved in comunas.geojson.
  - id: comunas-fill
    type: fill
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      fill-color: "#ffffff"
      fill-opacity: 0
    legend: false
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: COMUNA
          - p:
              - str: "Mean year: "
              - property: Mean_year
          - p:
              - str: "Period: "
              - property: Period
          - p:
              - str: "Years covered: "
              - property: First_year
              - str: "–"
              - property: Last_year
              - str: " ("
              - property: Hexagons
              - str: " hexagons)"

  # ---- Hydrography (merged from the former Hydrography page) ----
  # Colours (aquamarine / midnight blue / dark violet palette): natural water
  # in aquamarines, deepest for the biggest (rivers #00d6a8) to palest for
  # the smallest (ravines #c9fff0); engineered water in dark violets, deepest
  # for the biggest system (collector network #9400d3) to palest (reservoirs
  # and ponds #dba8ff, mostly man-made). Each line has a soft "-glow" copy
  # underneath (wider, blurred) for the neon look. Width, opacity and glow
  # step down with size so the hierarchy reads at a glance: rivers and the
  # collector network boldest, ravines and reservoirs faintest. The layer rail
  # (src/scripts/layer-rail.js) uses the same colours; keep them in step.
  #
  # Hydrography (rivers, streams, ravines, canals, reservoirs) all come from
  # the shared "hidrografia" source above; each TIPO is its own layer.
  - id: hydro-ravines-glow
    type: line
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Ravines"]
    paint:
      line-color: "#c9fff0"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 1.5, 14, 3]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 1.2, 14, 2.4]
      line-opacity: 0.08
    legend: false

  - id: hydro-ravines
    type: line
    label: Ravines (quebradas)
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Ravines"]
    paint:
      line-color: "#c9fff0"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.4, 14, 1]
      line-opacity: 0.45
      line-dasharray: [3, 2]
    legend: false
    interactive: &hydro-popup
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: TIPO
          - p:
              - str: "Type in source: "
              - property: CAPA

  - id: hydro-reservoirs-glow
    type: line
    layout: { visibility: none }   # engineered features start off
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Reservoirs and ponds"]
    paint:
      line-color: "#dba8ff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 2, 14, 4]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 1.6, 14, 3.2]
      line-opacity: 0.15
    legend: false

  - id: hydro-reservoirs
    type: line
    layout: { visibility: none }   # engineered features start off
    label: Reservoirs and ponds
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Reservoirs and ponds"]
    paint:
      line-color: "#dba8ff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.6, 14, 1.5]
      line-opacity: 0.6
    legend: false
    interactive: *hydro-popup

  - id: hydro-canals-glow
    type: line
    layout: { visibility: none }   # engineered features start off
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Canals"]
    paint:
      line-color: "#b44cff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 6]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 2.4, 14, 4.8]
      line-opacity: 0.2
    legend: false

  - id: hydro-canals
    type: line
    layout: { visibility: none }   # engineered features start off
    label: Canals
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Canals"]
    paint:
      line-color: "#b44cff"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 0.8, 14, 2]
      line-opacity: 0.75
    legend: false
    interactive: *hydro-popup

  - id: hydro-streams-glow
    type: line
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Streams"]
    paint:
      line-color: "#7fffd4"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 4, 14, 9]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 3.2, 14, 7.2]
      line-opacity: 0.3
    legend: false

  - id: hydro-streams
    type: line
    label: Streams (esteros)
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Streams"]
    paint:
      line-color: "#7fffd4"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 1.1, 14, 2.8]
      line-opacity: 0.9
    legend: false
    interactive: *hydro-popup

  - id: hydro-rivers-glow
    type: line
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Rivers"]
    paint:
      line-color: "#00d6a8"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 10, 14, 24]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 8, 14, 19.2]
      line-opacity: 0.55
    legend: false

  - id: hydro-rivers
    type: line
    label: Rivers
    source: hidrografia
    filter: ["==", ["get", "TIPO"], "Rivers"]
    paint:
      line-color: "#00d6a8"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 3, 14, 8]
      line-opacity: 1
    legend: false
    interactive: *hydro-popup

  # Collector network (Sistema Colector) from the Dirección de Obras
  # Hidráulicas: the deepest dark violet. sistema_colector.geojson is
  # "Sistema Colector.geojson" cut down to the Región Metropolitana (1,265 of
  # 2,937 lines) with only the fields used here, so the page loads faster.
  - id: sistema-colector-glow
    type: line
    layout: { visibility: none }   # engineered features start off
    source: colector
    paint:
      line-color: "#9400d3"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 6, 14, 12]
      line-blur: ["interpolate", ["linear"], ["zoom"], 10, 4.8, 14, 9.6]
      line-opacity: 0.4
    legend: false

  - id: sistema-colector
    type: line
    layout: { visibility: none }   # engineered features start off
    label: Collector network
    source: colector
    paint:
      line-color: "#9400d3"
      line-width: ["interpolate", ["linear"], ["zoom"], 10, 1.6, 14, 4]
      line-opacity: 0.95
    legend: false
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: NOMBRE
                else: "Collector"
          - p:
              - str: "Length: "
              - property: LONG_M
              - str: " m"
          - p:
              - str: "Updated: "
              - property: ACTUALIZADO
          - p:
              - str: "Source: Dirección de Obras Hidráulicas"


  # Comuna boundaries for the 32 comunas, from caracena/chile-geojson on
  # GitHub (Región Metropolitana file). The comuna picked in the dropdown is
  # (or clicked on the map) is drawn thicker and in white; picking it also flies the map there (see
  # src/scripts/comuna-zoom.js).
  - id: comunas-outline
    type: line
    label: Comuna boundaries
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      line-color: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], "#ffffff", "#9aa4ac"]
      line-width: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], 3, 1.2]
      line-opacity: 0.85
    legend: false

  # Comuna names, one point per comuna (comunas_labels.geojson, made from the
  # boundaries). Fonts come from the basemap's MapTiler font server.
  - id: comunas-labels
    type: symbol
    label: Comuna names
    source:
      type: geojson
      url: "/data/comunas_labels.geojson"
    layout:
      text-field: ["get", "COMUNA"]
      # JetBrains Mono (the body font): declared under "font-faces" in public/data/Basemap.GIS4DP.json
      # (files in public/fonts/), so it matches the site's body text.
      text-font: ["JetBrains Mono", "Noto Sans Regular"]
      text-size: ["interpolate", ["linear"], ["zoom"], 10, 10, 13, 14]
      text-max-width: 7
    paint:
      text-color: "#e8e8e8"       # very light gray
      text-halo-color: "#0a0a0a"  # very dark gray outline (onyx)
      text-halo-width: 1.5
    legend: false
