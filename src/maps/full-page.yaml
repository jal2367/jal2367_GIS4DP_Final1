# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on src/pages/full_page_map.mdx: it fills the window under the site
# header, with zoom and reset buttons, a legend and a layer panel.
type: map
id: full-page
config:
  mapStyle: "/data/Basemap.GIS4DP.json"
  center: [-70.70, -33.47]   # middle of the hexagons in the 32 comunas
  zoom: 10.5
  minZoom: 10     # farthest zoom-out: just fits the 32 comunas
  pitch: 55      # camera tilt in degrees (0 = flat, max 85)
  bearing: -20   # rotation in degrees (0 = north up)

# No colour legend: the period pill buttons in the layer panel show the colours
# (src/scripts/map-panels.js). The size legend is drawn on the page.
legend: false

# Mesh patterns for the hexagons, one per period: a fine staggered grid of
# slightly lighter dots on the period colour (8 px PNG tiles in public/img/,
# drawn at pixelRatio 2: dots 1 px wide and 2 px apart on screen, crisp on
# high-resolution screens), so it reads as a texture rather than single dots.
# (A pattern replaces the fill colour, so the colour is baked into each image.)
images:
  stipple-1: { url: "/img/stipple-1.png", pixelRatio: 2 }
  stipple-2: { url: "/img/stipple-2.png", pixelRatio: 2 }
  stipple-3: { url: "/img/stipple-3.png", pixelRatio: 2 }
  stipple-4: { url: "/img/stipple-4.png", pixelRatio: 2 }
  stipple-5: { url: "/img/stipple-5.png", pixelRatio: 2 }

# Comuna filter: a dropdown in the layer panel. Every hexagon layer's `filter`
# reads the choice with ["global-state", "comuna"] and shows either all
# hexagons or only that comuna's. The comuna outlines highlight the choice.
state:
  comuna:
    default: "All comunas"
  # The comuna last clicked on the map (set by src/scripts/comuna-zoom.js);
  # its boundary is highlighted like the dropdown choice. No control.
  highlight:
    default: ""
  # "Average years of development" on/off: a checkbox in the layer panel. On = each hexagon
  # scaled by its number of years; off = all hexagons full size.
  sizes:
    default: true
  # Period switches (checkboxes in the layer panel); each one controls both
  # the 3D and the draped layer of its period.
  p1:
    default: true
  p2:
    default: true
  p3:
    default: true
  p4:
    default: true
  p5:
    default: true
parameters:
  comuna:
    label: Comuna
    type: enum
    values:
      - All comunas
      - Cerrillos
      - Cerro Navia
      - Conchalí
      - El Bosque
      - Estación Central
      - Huechuraba
      - Independencia
      - La Cisterna
      - La Florida
      - La Granja
      - La Pintana
      - La Reina
      - Las Condes
      - Lo Barnechea
      - Lo Espejo
      - Lo Prado
      - Macul
      - Maipú
      - Ñuñoa
      - Pedro Aguirre Cerda
      - Peñalolén
      - Providencia
      - Pudahuel
      - Quilicura
      - Quinta Normal
      - Recoleta
      - Renca
      - San Joaquín
      - San Miguel
      - San Ramón
      - Santiago
      - Vitacura
  p1:
    label: 1680–1806
    type: toggle
  p2:
    label: 1840–1941
    type: toggle
  p3:
    label: 1943–1985
    type: toggle
  p4:
    label: 1986–2013
    type: toggle
  p5:
    label: 2014–2024
    type: toggle
  sizes:
    label: Average years of development
    type: toggle

# Hexagons coloured by Year_Mean: 5 classes, natural breaks (Jenks), from
# #00204d (oldest) to #c2d96b (newest). Each period has two draped layers,
# sized and full-size. The period checkboxes are state switches (p1-p5) read
# by both layers' `filter`.
#
# Hexa_wgs84.geojson is Hexa.geojson converted from UTM zone 19S to
# longitude/latitude, which web maps need.
#
# Hexagons have no popup; click a comuna instead for its summary.
#
# Hexagon size shows the number of years (#Years); see hexa_sized under
# sources: above. Click a comuna for its summary.
#
# To change a period's colour, make a new mesh image (public/img/) and change
# its legend color.
# The hexagons, each loaded once and shared by the hexagon layers:
# hexa = full-size hexagons; hexa_sized = the same hexagons shrunk around
# their centre by number of years (#Years): 0 years = 20% of full width,
# 54 years or more (the top 10%) = 100%, linear in between. Size_pct holds
# the percentage. Made from Hexa_wgs84.geojson by a script.
sources:
  hexa:
    type: geojson
    url: "/data/Hexa_wgs84.geojson"
  hexa_sized:
    type: geojson
    url: "/data/Hexa_sized.geojson"

layers:
  # Hexagons, all draped over the terrain and basemap (flat fills follow the
  # ground). Fading from 70% to 30% as you zoom in to street level.
  # Sized hexagons, shown when "Average years of development" is on:
  - id: hexa-sized-1680-1806
    type: fill
    source: hexa_sized
    filter: ["all", ["<", ["get", "Year_Mean"], 1840], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: stipple-1
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: { label: 1680–1806, color: "#00204d", shape: square }

  - id: hexa-sized-1840-1941
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: stipple-2
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: { label: 1840–1941, color: "#314e55", shape: square }

  - id: hexa-sized-1943-1985
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: stipple-3
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: { label: 1943–1985, color: "#617d5c", shape: square }

  - id: hexa-sized-1986-2013
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: stipple-4
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: { label: 1986–2013, color: "#92ab64", shape: square }

  - id: hexa-sized-2014-2024
    type: fill
    source: hexa_sized
    filter: ["all", [">=", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true], ["==", ["global-state", "sizes"], true]]
    paint:
      fill-pattern: stipple-5
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: { label: 2014–2024, color: "#c2d96b", shape: square }

  # Full-size hexagons, shown when "Average years of development" is off:
  - id: hexa-full-1680-1806
    type: fill
    source: hexa
    filter: ["all", ["<", ["get", "Year_Mean"], 1840], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p1"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: stipple-1
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: false

  - id: hexa-full-1840-1941
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1840], ["<", ["get", "Year_Mean"], 1942.5], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p2"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: stipple-2
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: false

  - id: hexa-full-1943-1985
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1942.5], ["<", ["get", "Year_Mean"], 1985.666667], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p3"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: stipple-3
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: false

  - id: hexa-full-1986-2013
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 1985.666667], ["<", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p4"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: stipple-4
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: false

  - id: hexa-full-2014-2024
    type: fill
    source: hexa
    filter: ["all", [">=", ["get", "Year_Mean"], 2014.4], ["any", ["==", ["global-state", "comuna"], "All comunas"], ["==", ["get", "COMUNA"], ["global-state", "comuna"]]], ["==", ["global-state", "p5"], true], ["==", ["global-state", "sizes"], false]]
    paint:
      fill-pattern: stipple-5
      fill-opacity: ["interpolate", ["linear"], ["zoom"], 12, 0.7, 14.5, 0.3]
    legend: false

  # Invisible comuna areas that make each comuna clickable: a click opens a
  # summary popup and flies the map to the comuna (src/scripts/comuna-zoom.js).
  # Mean_year, Period, Hexagons, First_year and Last_year were calculated from
  # the hexagons and saved in comunas.geojson.
  - id: comunas-fill
    type: fill
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      fill-color: "#ffffff"
      fill-opacity: 0
    legend: false
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: COMUNA
          - p:
              - str: "Mean year: "
              - property: Mean_year
          - p:
              - str: "Period: "
              - property: Period
          - p:
              - str: "Years covered: "
              - property: First_year
              - str: "–"
              - property: Last_year
              - str: " ("
              - property: Hexagons
              - str: " hexagons)"

  # Comuna boundaries for the 32 comunas, from caracena/chile-geojson on
  # GitHub (Región Metropolitana file). The comuna picked in the dropdown is
  # (or clicked on the map) is drawn thicker and in white; picking it also flies the map there (see
  # src/scripts/comuna-zoom.js).
  - id: comunas-outline
    type: line
    label: Comuna boundaries
    source:
      type: geojson
      url: "/data/comunas.geojson"
    paint:
      line-color: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], "#ffffff", "#9aa4ac"]
      line-width: ["case", ["any", ["==", ["get", "COMUNA"], ["global-state", "comuna"]], ["==", ["get", "COMUNA"], ["global-state", "highlight"]]], 3, 1.2]
      line-opacity: 0.85
    legend: false

  # Comuna names, one point per comuna (comunas_labels.geojson, made from the
  # boundaries). Fonts come from the basemap's MapTiler font server.
  - id: comunas-labels
    type: symbol
    label: Comuna names
    source:
      type: geojson
      url: "/data/comunas_labels.geojson"
    layout:
      text-field: ["get", "COMUNA"]
      text-font: ["Metropolis Medium", "Noto Sans Regular"]
      text-size: ["interpolate", ["linear"], ["zoom"], 10, 10, 13, 14]
      text-max-width: 7
    paint:
      text-color: "#e6e9ec"
      text-halo-color: "#2b2d30"
      text-halo-width: 1.5
    legend: false
