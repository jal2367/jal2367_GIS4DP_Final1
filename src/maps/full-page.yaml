# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on src/pages/full_page_map.mdx: it fills the window under the site
# header, with zoom and reset buttons, a legend and a layer panel.
type: map
id: full-page
config:
  mapStyle: "/data/Basemap.GIS4DP.json"
  center: [-70.65, -33.45]
  zoom: 10

# Where the legend sits: top-left (default), top-right, bottom-left, bottom-right.
legend:
  position: bottom-left

# Add your own layers here (see src/maps/layers.yaml for examples).
layers:
  # Hexagon grid. Hexa_wgs84.geojson is Hexa.geojson converted from
  # UTM zone 19S to longitude/latitude, which web maps need.
  - id: hexa
    type: fill
    label: Hexagons
    source:
      type: geojson
      url: "/data/Hexa_wgs84.geojson"
    paint:
      fill-color: "#d73027"
      fill-opacity: 0.35
      fill-outline-color: "#ffffff"
    legend: { label: Hexagons, color: "#d73027", shape: square }
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: COMUNA
                else: "Hexagon"
          - p:
              - str: "Years: "
              - property: Year_Min
              - str: " to "
              - property: Year_Max
          - p:
              - str: "Mean year: "
              - property: Year_Mean
